name: Deploy site web

on:
  push:
    branches:
      - main  # Déclenchement lors de l'envoi sur la branche `main`

jobs:
  deploy:
    runs-on: ubuntu-latest  # Utiliser l'environnement Ubuntu pour exécuter le job

    steps:
      - name: 🚀 Cloner le dépôt
        uses: actions/checkout@v4

      - name: 🔑 Configurer l'accès SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: 🔑 Tester la connexion SSH
        run: ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "echo 'Connexion réussie !'"

      - name: 📂 Déployer l'application Laravel
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /var/www/html/innov360
            git pull origin main
            composer install --no-dev --optimize-autoloader
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo chmod -R 775 storage bootstrap/cache
            sudo chown -R www-data:www-data storage
            sudo chmod -R 775 storage
            sudo systemctl restart apache2
          EOF

      - name: ✅ Fin du déploiement
        run: echo "Déploiement terminé avec succès !"
